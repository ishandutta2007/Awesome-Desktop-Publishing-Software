<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Dynamic Flow Gradient -->
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Subtle SVG animations */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .animated-element {
      animation: float 6s ease-in-out infinite;
    }
    .wave-line {
      stroke-dasharray: 12, 12;
      animation: pulse-wave 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Animated Dynamic Waves (Behind Foreground Content) -->
  <g opacity="0.4">
    <path class="wave-line" d="M -100 220 Q 200 120, 500 240 T 1100 160 T 1400 260" fill="none" stroke="url(#title-grad)" stroke-width="2"/>
    <path class="wave-line" d="M -100 100 Q 300 280, 700 100 T 1300 220" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Geometric Grid & Document Frame Accents (Dynamic Background Layer) -->
  <g opacity="0.15">
    <rect x="50" y="40" width="1100" height="240" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="8 8"/>
    <!-- Page grid mock lines -->
    <line x1="150" y1="40" x2="150" y2="280" stroke="#94a3b8" stroke-width="1"/>
    <line x1="1050" y1="40" x2="1050" y2="280" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Foreground Content Group (Always visible & crisp on top) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 52)" class="animated-element">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
      <text x="32" y="21" class="badge-text">Desktop Publishing 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title" filter="url(#glow)">Awesome Desktop Publishing</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">A curated list of commercial layout software &amp; open-source DTP tools</text>

    <!-- Dynamic Tech Tags (Bottom Row) -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">📄 Page Layout</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="158" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">🖨️ Print Design</text>

      <!-- Tag 3 -->
      <rect x="284" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="300" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">🎨 Typography</text>

      <!-- Tag 4 -->
      <rect x="426" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="442" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">🔓 Open Source</text>
    </g>
  </g>
</svg>
